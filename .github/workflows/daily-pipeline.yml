name: EuroPulse 10-Minute Autonomous Pipeline

on:
  schedule:
    # Runs automatically every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pipeline'
  cancel-in-progress: false

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch Live Eurostat Macro Data
        run: node scripts/fetch-eurostat.mjs

      - name: Fetch Live European Jobs
        run: node scripts/fetch-jobs.mjs --write

      - name: Ingest European RSS Dispatches
        run: node scripts/ingest-daily.mjs --write

      - name: Generate European Business Pulse
        run: node scripts/generate-pulse.mjs --write

      - name: Verify Strict TypeScript & Templates
        run: npm run check

      - name: Commit & Push New Intelligence
        id: data_check
        run: |
          git add src/data/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new news or job changes detected in this 10-minute cycle."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(data): automated 10-minute European intelligence update [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Configure GitHub Pages
        if: steps.data_check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Static Site
        if: steps.data_check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Validate Internal Links
        if: steps.data_check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/check-links.mjs

      - name: Upload GitHub Pages Artifact
        if: steps.data_check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: steps.data_check.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
