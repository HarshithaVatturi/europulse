name: EuroPulse Live Feed Refresh (News + Jobs)

on:
  schedule:
    # Autonomous refresh every 30 minutes (48 cycles per day)
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-refresh
  cancel-in-progress: false

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Source Registry & Run Unit Tests
        run: |
          npm run feed:check
          npm run test:feed

      - name: Run Feed Ingestion Pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
        run: npm run feed:refresh

      - name: Check for Changes & Commit to Main
        id: commit_check
        run: |
          git add src/data/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No data changes detected in this cycle. Skipping commit."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(feed): automated European news & jobs refresh"
            git pull --rebase origin main || true
            git push origin main
          fi
